[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pdmr"
version = "0.1.0"
description = "Proteome-wide cis-MR and colocalisation scan against Parkinson's disease"
authors = [{ name = "Salvatore Barbagallo" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "pyarrow>=12", "bed-reader>=1.0", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
